name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck
        run: shellcheck -x scripts/*.sh tests/*.sh

      - name: Run actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color .github/workflows/*.yml examples/*/workflow.yml

  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          inputs: action.yml .github/workflows
          advanced-security: false
          annotations: true

  validate:
    name: Validate Sortie workflow files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read minimum Sortie version
        id: minimum
        run: |
          version=$(grep -m1 -E '^(readonly )?MIN_SORTIE_VERSION=' scripts/prepare.sh | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          if [ -z "$version" ]; then
            echo "::error::MIN_SORTIE_VERSION not found in scripts/prepare.sh"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare
        id: prepare
        env:
          SA_WORKFLOW: testdata/WORKFLOW.md
          SA_TASK: validate
          SA_VERSION: ${{ steps.minimum.outputs.version }}
          SA_VERIFY_ATTESTATION: 'true'
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prepare.sh

      - name: Install Sortie
        id: install
        env:
          SA_TAG: ${{ steps.prepare.outputs.tag }}
          SA_ARCHIVE: ${{ steps.prepare.outputs.archive }}
          SA_CACHE_DIR: ${{ steps.prepare.outputs.cache-dir }}
          SA_BIN_DIR: ${{ steps.prepare.outputs.bin-dir }}
          SA_VERIFY: ${{ steps.prepare.outputs.verify }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/install.sh

      - name: Validate workflow files
        env:
          SORTIE_BIN: ${{ steps.install.outputs.bin }}
          SORTIE_ACTION_TASK_FILE: ${{ runner.temp }}/task.json
        run: |
          status=0
          for file in examples/*/WORKFLOW.md testdata/*.md; do
            echo "::group::$file"
            "$SORTIE_BIN" validate "$file" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  install-test:
    name: Installer tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run installer tests
        run: bash tests/install_test.sh
